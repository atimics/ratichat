app = "ratichat-bot-prod"
primary_region = "sjc"

kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "../../../Dockerfile"

[env]
  ADMIN_API_HOST = "0.0.0.0"
  ADMIN_API_PORT = "8000"
  BOT_CAPABILITY_PROFILE = "matrix_steward"
  BOT_PUBLIC_URL = "https://ratichat-bot-prod.fly.dev"
  MATRIX_BACKUP_INTERVAL_SECONDS = "86400"
  CHATBOT_DB_PATH = "/data/chatbot.db"
  CHATBOT_ENV = "production"
  DISCORD_OWNER_USER_IDS = "1360632999720390918"
  PROACTIVE_DISCORD_CHANNEL_IDS = "1557869736971477105"
  PROACTIVE_PUBLIC_SOURCES_ENABLED = "true"
  PROACTIVE_TIMEZONE = "America/Vancouver"
  FARCASTER_OUTBOUND_ENABLED = "false"
  LOG_LEVEL = "INFO"
  TELEGRAM_OFFSET_PATH = "/data/telegram_offset.txt"
  TELEGRAM_OPERATOR_QUEUE_PATH = "/data/telegram_operator_queue.jsonl"

[processes]
  app = "sh /app/scripts/run_fly_bot.sh"

[[mounts]]
  source = "ratichat_bot_data"
  destination = "/data"
  initial_size = "3gb"
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["app"]

[[restart]]
  policy = "on-failure"
  retries = 10
  processes = ["app"]
